name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: |
          cd backend && pip install -e ".[dev]"
          cd ../frontend && npm ci
      - name: Check
        run: make check

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships an Android SDK with accepted licenses; AGP downloads the
      # compileSdk platform it is missing. iOS targets are skipped on Linux.
      - name: Tests (shared KMP + both app flavors) and debug APKs
        run: ./gradlew --console=plain :shared:testAndroidHostTest :androidApp:testFullDebugUnitTest :androidApp:testPlayDebugUnitTest :androidApp:assembleFullDebug :androidApp:assemblePlayDebug
